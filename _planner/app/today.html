<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: voice-first phone app. A neural "core" you talk to sits on top, one next action sits under it, everything else folds away.
   Deep ink ground, signal-cyan accent; violet appears only while it is thinking. */
:root{--bg:#0a1118;--card:#121c25;--ink:#e6eef3;--mute:#8fa2b0;--line:#22313c;--acc:#3fc1c9;--acc-ink:#04262a;--soft:#12313a;--acc2:#c9f6f8;--think:#a99cff;
  --good:#6fd193;--warn:#f0b354;--bad:#ff8a80;--warn-bg:#3a2c10;--bad-bg:#3d1a17;--good-bg:#143524;
  --disp:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px;color-scheme:dark}
:root[data-theme="light"]{--bg:#f2f5f7;--card:#ffffff;--ink:#12202b;--mute:#5d6e7b;--line:#d9e1e7;--acc:#0b7f86;--acc-ink:#ffffff;--soft:#e3f1f1;--acc2:#065a60;--think:#5b4bd6;
  --good:#1f7a45;--warn:#a86400;--bad:#b3261e;--warn-bg:#fdf1dc;--bad-bg:#fbe6e4;--good-bg:#e2f3e8;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:8px}
header h1{font:700 21px/1.1 var(--disp);margin:0;letter-spacing:-.01em}
header small{display:block;font:500 12px var(--body);color:var(--mute);letter-spacing:.02em;margin-top:3px}
header .hg{flex:1;min-width:0}
header button{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0}
h2{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
button{font:600 14px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--acc);padding:6px 8px}
button.sm{padding:6px 10px;font-size:13px}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.5}

/* the core */
.core{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:2px 4px;background:radial-gradient(58% 46% at 50% 26%,color-mix(in srgb,var(--acc) 11%,transparent),transparent)}
.orbBtn{background:none;border:0;padding:0;border-radius:28px;line-height:0;-webkit-tap-highlight-color:transparent}
.orbBtn canvas{width:240px;height:190px;max-width:100%;display:block}
.state{font:600 11px var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--acc);min-height:16px}
.state[data-s="thinking"]{color:var(--think)}
.say{font:500 18px/1.36 var(--disp);text-align:center;margin:2px 0 0;text-wrap:balance;max-width:34ch;min-height:49px}
.heard{color:var(--mute);font-size:14px;text-align:center;margin:0;min-height:20px;max-width:46ch;overflow-wrap:anywhere}
.heard i{font-style:normal;opacity:.55}
.inrow{width:100%;flex-wrap:nowrap;align-items:flex-end;margin-top:4px}
.inrow textarea{flex:1;min-width:0;height:44px;min-height:44px;max-height:140px;resize:none}
.inrow button{height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border-radius:99px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.ok{border-color:var(--acc);color:var(--acc)}
.core .chips{flex-wrap:wrap;justify-content:center;overflow:visible;min-height:34px;margin-top:2px}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.stat button{border-radius:99px;padding:5px 11px;font-size:13px;font-variant-numeric:tabular-nums}
.stat .bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.stat .warn{color:var(--warn);border-color:var(--warn-bg);background:var(--warn-bg)}

.pick{border-left:4px solid var(--acc)}
.pick .n{font:600 12px var(--body);letter-spacing:.04em;color:var(--acc)}
.pick h3{font:600 18px/1.25 var(--disp);margin:3px 0 6px;text-wrap:balance}
.why{color:var(--mute);font-size:14px;margin:0 0 6px}
.first{background:var(--soft);border-radius:9px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.pill{display:inline-block;font:600 11px var(--body);letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--acc);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.mute{background:var(--line);color:var(--mute)}
.item{padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:first-child{padding-top:2px}
.item .t{font-weight:500}
.item .m,.m{color:var(--mute);font-size:13px}
.item .m{margin-top:2px}
.num{font-variant-numeric:tabular-nums}
.big{font:700 28px var(--disp);font-variant-numeric:tabular-nums}
textarea,input,select{font:15px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:auto}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);flex:none;margin-right:4px}
details.sec[open]>summary::after{transform:rotate(225deg)}
.secb{padding:0 14px 12px}
.item details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{background:var(--bg);border-radius:8px;padding:6px 1px}
.week .on{outline:1px solid var(--acc)}
.week span{display:block;font-size:11px;color:var(--mute)}
.week b{display:block;font:600 11px var(--body);margin:2px 0}
.week i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line)}
.week i.y{background:var(--good)}
.bub{border-radius:12px;padding:9px 11px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.bub.me{align-self:flex-end;background:var(--soft)}
.bub.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);padding:13px 2px 12px;font-size:13px}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:9;font-size:14px;max-width:90vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;padding:0;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:22px 8px}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 var(--body);margin:8px 0;background:var(--bg);border-radius:10px;padding:10px;max-height:340px;overflow:auto}
label{font-size:13px;color:var(--mute);display:block;margin:10px 0 4px}
</style>

<script type="text/plain" id="gsManifest">
{
  "timeZone": "America/Toronto",
  "dependencies": {},
  "exceptionLogging": "STACKDRIVER",
  "runtimeVersion": "V8",
  "oauthScopes": [
    "https://www.googleapis.com/auth/datastore",
    "https://www.googleapis.com/auth/script.external_request",
    "https://www.googleapis.com/auth/spreadsheets",
    "https://www.googleapis.com/auth/script.scriptapp"
  ]
}
</script>
<script type="text/plain" id="gsCode">
/**
 * TutorWise Scheduler -> Google Sheet bridge.
 *
 * Reads your scheduler's data (the "tutorwise-os" Firebase project behind schedule.tutorwise.ca)
 * as you, READ-ONLY, and copies it into one Google Sheet that your planner reads.
 * It never changes anything in the scheduler.
 *
 * To link: choose "setup" in the function menu above and press Run. Allow access when asked.
 * After that it refreshes by itself every hour.
 */
var PROJECT_ID = 'tutorwise-os';
var SHEET_TITLE = 'TutorWise Scheduler Export';
var WEEKS_BACK = 16;
var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

/** Run this once. */
function setup() {
  var ss = sheet_();
  exportNow();
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'exportNow') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('exportNow').timeBased().everyHours(1).create();
  Logger.log('Linked. Your sheet: ' + ss.getUrl());
}

/** Copies the scheduler into the sheet. Runs every hour once setup() has been run. */
function exportNow() {
  var ss = sheet_(), started = new Date().toISOString();
  try {
    var data = load_();
    var tabs = build_(data.cfg, data.weeks);
    write_(ss, tabs);
    meta_(ss, [['Status', 'ok'], ['Exported at', started], ['Signed in as', data.auth],
      ['Scheduler last changed', data.cfg.updatedAt || ''], ['Weeks in scheduler', Object.keys(data.weeks).length],
      ['This week starts', mondayKey_()], ['Students', tabs.Students.length - 1], ['Sessions exported', tabs.Sessions.length - 1]]);
  } catch (e) {
    meta_(ss, [['Status', 'error'], ['Exported at', started], ['Error', String((e && e.message) || e).slice(0, 1500)]]);
    throw e;
  }
}

/* ---------- reading the scheduler ---------- */
function load_() {
  var auth = token_();
  var cfg = dec_({mapValue: get_('schedulerConfig/main', auth)});
  var weeks = {}, tok = '';
  do {
    var page = get_('schedulerWeeks?pageSize=40' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''), auth);
    (page.documents || []).forEach(function (d) { weeks[d.name.split('/').pop()] = dec_({mapValue: d}); });
    tok = page.nextPageToken || '';
  } while (tok);
  return {cfg: cfg, weeks: weeks, auth: auth.mode};
}
function token_() {
  var key = PropertiesService.getScriptProperties().getProperty('SA_KEY');
  if (key) return {mode: 'service account', token: saToken_(JSON.parse(key))};
  return {mode: 'your Google account', token: ScriptApp.getOAuthToken()};
}
function get_(path, auth, quota) {
  var headers = {Authorization: 'Bearer ' + auth.token};
  if (quota) headers['X-Goog-User-Project'] = PROJECT_ID;
  var res = UrlFetchApp.fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents/' + path,
    {headers: headers, muteHttpExceptions: true});
  var code = res.getResponseCode(), body = res.getContentText();
  if (code === 403 && !quota && auth.mode !== 'service account' && /has not been used|is disabled|SERVICE_DISABLED|quota project/i.test(body)) return get_(path, auth, true);
  if (code !== 200) throw new Error('Could not read the scheduler (' + code + ') at ' + path.split('?')[0] + ': ' + body.slice(0, 700));
  return JSON.parse(body);
}
function saToken_(k) {
  var now = Math.floor(Date.now() / 1000);
  var enc = function (o) { return Utilities.base64EncodeWebSafe(JSON.stringify(o)).replace(/=+$/, ''); };
  var unsigned = enc({alg: 'RS256', typ: 'JWT'}) + '.' + enc({iss: k.client_email, scope: 'https://www.googleapis.com/auth/datastore',
    aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3000});
  var sig = Utilities.base64EncodeWebSafe(Utilities.computeRsaSha256Signature(unsigned, k.private_key)).replace(/=+$/, '');
  var res = UrlFetchApp.fetch('https://oauth2.googleapis.com/token', {method: 'post', muteHttpExceptions: true,
    payload: {grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: unsigned + '.' + sig}});
  var j = JSON.parse(res.getContentText());
  if (!j.access_token) throw new Error('Service account sign-in failed: ' + res.getContentText().slice(0, 300));
  return j.access_token;
}
/** Firestore's typed JSON -> plain values. */
function dec_(v) {
  if (v == null) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(dec_);
  if ('mapValue' in v) {
    var o = {}, f = v.mapValue.fields || {};
    Object.keys(f).forEach(function (k) { o[k] = dec_(f[k]); });
    return o;
  }
  return null;
}

/* ---------- shaping it into tables ---------- */
function build_(cfg, weeks) {
  var teachers = cfg.teachers || [], tName = {};
  teachers.forEach(function (t) { tName[t.id] = t.name || t.id; });
  var profiles = cfg.studentProfiles || {}, active = cfg.students || [], inactive = cfg.inactiveStudents || [];
  var keys = Object.keys(weeks).filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }).sort();
  var cutoff = addDays_(mondayKey_(), -7 * WEEKS_BACK), out = {};

  out.Students = [['Student', 'Active', 'Lessons per week', 'Weight', 'Makeup balance (h)', 'Credits earned (h)', 'Credits used (h)']];
  active.concat(inactive.filter(function (n) { return active.indexOf(n) < 0; })).forEach(function (n) {
    var p = profiles[n] || {}, m = makeup_(n, p, weeks);
    out.Students.push([n, active.indexOf(n) >= 0 ? 'yes' : 'no', p.lessonsPerWeek == null ? '' : p.lessonsPerWeek, p.weight == null ? '' : p.weight,
      p.makeupOffset || 0, m.given, m.used]);
  });

  out.Timetable = [['Student', 'Day', 'Start', 'End', 'Teacher']];
  each_(cfg.defaultSchedule || {}, function (tid, day, s) {
    out.Timetable.push([s.student, day, clock_(s.start), clock_(s.end), tName[tid] || tid]);
  });

  out.Sessions = [['Week of', 'Date', 'Day', 'Student', 'Teacher', 'Start', 'End', 'Hours', 'Status', 'Billing month']];
  keys.forEach(function (k) {
    if (k < cutoff) return;
    var w = weeks[k] || {}, hol = w.holidays || [], rm = billMonth_(k, w);
    each_(w.schedule || {}, function (tid, day, s) {
      var status = hol.indexOf(day) >= 0 ? 'holiday' : (s.attended == null ? '' : String(s.attended));
      out.Sessions.push([k, addDays_(k, DAYS.indexOf(day)), day, s.student, tName[tid] || tid, clock_(s.start), clock_(s.end),
        Math.round((s.end - s.start) / 60 * 100) / 100, status, rm]);
    });
  });

  out.Teachers = [['Id', 'Name', 'Capacity']].concat(teachers.map(function (t) { return [t.id, t.name || '', t.capacity == null ? '' : t.capacity]; }));
  return out;
}
/** Every real student session in a schedule, in teacher / weekday / time order. Prep blocks are skipped. */
function each_(sched, fn) {
  Object.keys(sched).sort().forEach(function (tid) {
    DAYS.forEach(function (day) {
      ((sched[tid] || {})[day] || []).slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (s) {
        if (s && s.student && !s.isAdmin && typeof s.start === 'number' && typeof s.end === 'number') fn(tid, day, s);
      });
    });
  });
}
/** Same arithmetic the scheduler uses for makeup credits (earned on "missed, credit" weeks, used on extra attended hours). */
function makeup_(name, prof, weeks) {
  var lpw = prof.lessonsPerWeek || 0, given = 0, used = 0;
  Object.keys(weeks).forEach(function (k) {
    var sch = 0, att = 0, yel = 0, cnt = 0;
    each_((weeks[k] || {}).schedule || {}, function (tid, day, s) {
      if (s.student !== name) return;
      var h = (s.end - s.start) / 60; sch += h; cnt++;
      if (s.attended === 'attended') att += h;
      if (s.attended === 'missed_credit') yel += h;
    });
    if (!cnt) return;
    var normal = lpw > 0 ? lpw * (sch / cnt) : sch;
    given += Math.min(Math.max(0, normal - att), yel);
    used += Math.max(0, att - normal);
  });
  return {given: Math.round(given * 100) / 100, used: Math.round(used * 100) / 100};
}
/** The month a week is billed to: the scheduler's manual choice, otherwise the month its Wednesday falls in. */
function billMonth_(key, w) {
  var rm = w && w.reportingMonth;
  if (rm && typeof rm.year === 'number' && typeof rm.month === 'number') return rm.year + '-' + ('0' + (rm.month + 1)).slice(-2);
  return addDays_(key, 2).slice(0, 7);
}
/** Scheduler times are minutes after noon. */
function clock_(m) {
  var t = 720 + m;
  return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2);
}
function addDays_(key, n) {
  var p = key.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10);
}
function mondayKey_() {
  var now = new Date(), today = Utilities.formatDate(now, 'America/Toronto', 'yyyy-MM-dd'), dow = +Utilities.formatDate(now, 'America/Toronto', 'u');
  return addDays_(today, 1 - dow);
}

/* ---------- writing the sheet ---------- */
function sheet_() {
  var props = PropertiesService.getScriptProperties(), id = props.getProperty('SHEET_ID');
  if (id) { try { return SpreadsheetApp.openById(id); } catch (e) {} }
  var ss = SpreadsheetApp.create(SHEET_TITLE);
  props.setProperty('SHEET_ID', ss.getId());
  return ss;
}
function tab_(ss, name) { return ss.getSheetByName(name) || ss.insertSheet(name); }
function fill_(ss, name, rows) {
  var sh = tab_(ss, name);
  sh.clearContents();

async function respond(text){

  V.heard=text;setState('thinking');
  const ref=db.collection('dumps').doc();ref.set({text,at:stamp(),reply:''}).catch(()=>{});

    if(!sample)throw {code:'none'};

    reply=String(r?.reply||`Understood, ${sir()}.`);
    if(applied.some(x=>x.includes('(fee sheet updated)')))reply+=' Your fee sheet is updated too.';
    else if(applied.some(x=>x.includes('overnight')))reply+=' I’ll put it in your fee sheet overnight.';
  }catch(e){
    if(e?.code==='not_granted')sample=null;
    const id='t'+Date.now().toString(36);await db.doc('tasks/'+id).set({t:text.slice(0,140),a:'planner',s:'ready',p:3,n:text,src:'talk (unsorted)',up:stamp()}).catch(()=>{});

  }

}
async function applyOps(ops,src){

      await db.doc('tasks/'+id).set({t:String(o.title).slice(0,200),a:AREAS[o.area]?o.area:'planner',s:o.kind==='idea'?'idea':'ready',p:[1,2,3,4].includes(o.pri)?o.pri:3,due:/^\d{4}-\d\d-\d\d$/.test(o.due||'')?o.due:null,hard:!!o.hard&&!!o.due,
        est:+o.est||null,next:o.next||'',ai:!!o.ai,n:o.notes||'',src:'talk '+today(),up:stamp()});out.push('added: '+o.title)}
    else if(o.op==='update'&&S.tasks.has(o.id)){const a={};const st=o.set||{};
      if(STAT[st.s]&&st.s!=='done')a.s=st.s;if(st.wait)a.wait=String(st.wait);if(/^\d{4}-\d\d-\d\d$/.test(st.due||''))a.due=st.due;if([1,2,3,4].includes(st.p))a.p=st.p;if(+st.est)a.est=+st.est;if(st.next)a.next=String(st.next);
      if(st.n)a.n=((S.tasks.get(o.id).n||'')+'\n'+today()+': '+st.n).trim();if(Object.keys(a).length){await up(o.id,a);out.push('updated: '+S.tasks.get(o.id).t)}}
    else if(o.op==='done'&&S.tasks.has(o.id)){await up(o.id,{s:'done',doneAt:stamp(),ev:'he said so: '+src.slice(0,80)});out.push('done: '+S.tasks.get(o.id).t)}

    else if(o.op==='schedule'){const s=findStu(o.student);const sl=(o.slots||[]).filter(x=>x.d>=0&&x.d<=6&&/^\d\d:\d\d$/.test(x.s||'')&&/^\d\d:\d\d$/.test(x.e||''));if(s&&sl.length){await upStu(s.id,{slots:sl,slotsOk:true});out.push('timetable: '+s.name)}}
    else if(o.op==='setting'&&o.key in DEF){await db.doc('settings/main').set({...S.settings,[o.key]:o.value});out.push('setting: '+o.key)}
    else if(o.op==='woke'&&/^\d\d:\d\d$/.test(o.time||'')){await markUp(o.time,true);out.push('up at '+o.time)}

  <div class="row" style="margin-top:14px"><button class="pri" data-act="saveSettings">Save</button><button data-act="close">Cancel</button></div>`)}
function upSheet(){const hb=S.habits.get(today())||{};
  sheet(`<h3 style="font:600 18px var(--disp);margin:0 0 10px">When did you get up?</h3><button class="pri" data-act="upNow" style="width:100%">Just now</button>
  <label for="upT">Or earlier, at</label><div class="row" style="flex-wrap:nowrap"><input type="time" id="upT" value="${esc(hb.upAt||nowHM())}"><button data-act="upSet">Set</button></div>
  <div class="row" style="margin-top:14px">${hb.up?'<button class="ghost" data-act="upClear">Clear it</button>':''}<button data-act="close">Cancel</button></div>`)}

/* ---------- voice ---------- */
function setState(st){V.state=st;renderCore()}
function say(text,speakIt,queue){V.say=text;V.greeting=false;renderCore();if(speakIt)speak(text,false,queue)}
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
  const sc=v=>(/daniel/i.test(v.name)?40:0)+(/premium/i.test(v.name)?30:0)+(/enhanced/i.test(v.name)?20:0)+(/en.GB/i.test(v.lang)?8:0)+(v.default?2:0);
  return vs.sort((a,b)=>sc(b)-sc(a))[0]}
async function speak(text,force,queue){
  if(!text||(!V.voiceOn&&!force))return;
  if(tts){if(V.ttsOff)return;
    try{await tts[queue&&tts.active()?'add':'speak'](text.slice(0,1900),{voice:S.settings.voice||'buttery',rate:1.05})}
    catch(e){if(e?.code==='not_granted'||e?.code==='unavailable'){V.ttsOff=true;renderCore()}}
    return}
  if(!('speechSynthesis'in window))return;
  try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),v=pickVoice();if(v)u.voice=v;u.rate=1.02;
    u.onstart=()=>{if(V.state==='idle')setState('speaking')};u.onend=u.onerror=()=>{if(V.state==='speaking'&&!speechSynthesis.pending)setState('idle')};u.onboundary=()=>orb.tick();
    speechSynthesis.speak(u)}catch(e){}}
function stopSpeak(){if(tts)tts.stop().catch(()=>{});else try{speechSynthesis.cancel()}catch(e){}if(V.state==='speaking')setState('idle')}
function wireTts(){
  tts.onState(({state})=>{if(state==='speaking'||state==='starting'){if(V.state==='idle')setState('speaking')}else if(state==='idle'&&V.state==='speaking')setState('idle')});
  tts.onPosition(()=>orb.tick())}
function wireDict(){
  dict.onFinal(({text})=>{V.buf=V.buf?V.buf+text:text.trimStart();V.partial='';V.lastHeard=Date.now();orb.kick(.9);renderCore()});
  dict.onPartial(({text})=>{V.partial=text;if(text){V.lastHeard=Date.now();orb.kick(.5)}renderCore()});
  dict.onState(({state,reason})=>{
    if(state==='listening'){V.lastHeard=Date.now();if(V.state==='starting')setState('listening')}
    else if(state==='idle'&&(V.state==='listening'||V.state==='starting')&&!V.finishing){
      clearInterval(V.silence);const text=V.buf.trim();V.buf='';V.partial='';
      if(reason==='viewer_stopped'&&text){respond(text);return}
      if(text){$('dump').value=text;grow()}
      if(reason==='not_granted'||reason==='unavailable')dict=null;
      setState('idle')}})}
function listen(){
  stopSpeak();V.buf='';V.partial='';V.finishing=false;V.lastHeard=Date.now();V.state='starting';
  dict.start().catch(er=>{clearInterval(V.silence);if(V.state==='starting'||V.state==='listening')setState('idle');
    if(er?.code==='not_granted'||er?.code==='unavailable'){dict=null;renderCore();$('dump').focus()}
    else if(er?.code!=='stopped'&&er?.code!=='dismissed')toast('The mic isn’t available right now. Typing still works.')});
  renderCore();
  clearInterval(V.silence);V.silence=setInterval(()=>{if(V.state!=='listening')return;const quiet=Date.now()-V.lastHeard,has=V.buf.trim();
    if(has&&!V.partial&&quiet>3200&&S.settings.autoSend!==false)finish(true);else if(!has&&!V.partial&&quiet>25000)finish(false)},250)}
async function finish(send){
  if(V.finishing||!dict)return;V.finishing=true;clearInterval(V.silence);
  try{await dict.stop()}catch(e){}
  const text=V.buf.trim();V.buf='';V.partial='';V.finishing=false;
  if(send&&text){V.state='idle';respond(text)}else setState('idle')}
function orbTap(){const st=V.state;
  if(st==='thinking')return;
  if(st==='listening'||st==='starting'){finish(true);return}
  if(dict){listen();return}
  if(st==='speaking'){stopSpeak();return}
  const el=$('dump');el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}
function grow(){const el=$('dump');el.style.height='44px';el.style.height=Math.min(140,el.scrollHeight+2)+'px'}

/* ---------- the core: a small neural brain drawn on canvas ---------- */
const orb=(()=>{
  const cv=$('orb'),ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return{set(){},kick(){},tick(){},sync(){}};
  const W=240,H=190,CX=120,CY=95,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P=new Path2D('M52 108C36 84 44 52 78 42C104 28 146 28 170 42C196 56 200 92 184 110C190 128 168 142 150 134C148 146 140 156 130 156L126 138C110 146 78 142 68 128C58 126 52 118 52 108Z');
  const SUL=['M70 122C96 108 124 112 150 100','M112 36C106 54 116 70 108 92','M150 134C158 122 172 116 186 110','M80 62C94 56 102 68 94 80','M142 50C154 58 150 72 164 78'].map(d=>new Path2D(d));
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const nodes=[],edges=[],adj=[];
  for(let i=0;i<58;i++){let best=null,bd=-1;for(let k=0;k<14;k++){let x,y,g=0;do{x=44+rnd()*160;y=30+rnd()*130;g++}while(!ctx.isPointInPath(P,x,y)&&g<80);if(g>=80)continue;
      let d=1e9;for(const n of nodes)d=Math.min(d,(n.x-x)**2+(n.y-y)**2);if(d>bd){bd=d;best={x,y}}}
    if(best)nodes.push({...best,e:0,ph:rnd()*6.28,r:1.3+rnd()*1.1})}
  nodes.forEach((n,i)=>{adj[i]=[]});
  nodes.forEach((n,i)=>{nodes.map((m,j)=>[j,(m.x-n.x)**2+(m.y-n.y)**2]).filter(a=>a[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,3).forEach(([j,d],k)=>{
    if(k===2&&d>700)return;const a=Math.min(i,j),b=Math.max(i,j);if(!edges.some(e=>e[0]===a&&e[1]===b)){edges.push([a,b]);adj[a].push(b);adj[b].push(a)}})});
  let dpr=1,state='idle',energy=0,env=0,last=0,acc=0,raf=0,lastTick=0,skip=false,C={a:'63,193,201',b:'201,246,248',t:'169,156,255'};const sparks=[];
  function colors(){const cs=getComputedStyle(document.documentElement),hx=(v,f)=>{const s=cs.getPropertyValue(v).trim();if(!/^#[0-9a-f]{6}$/i.test(s))return f;const n=parseInt(s.slice(1),16);return `${n>>16},${(n>>8)&255},${n&255}`};
    C={a:hx('--acc',C.a),b:hx('--acc2',C.b),t:hx('--think',C.t)}}
  function size(){dpr=Math.min(3,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr}
  function spawn(from){if(sparks.length>64)return;let a,b;if(from!==undefined&&adj[from].length){a=from;b=adj[from][Math.floor(rnd()*adj[from].length)]}else{const e=edges[Math.floor(rnd()*edges.length)];if(rnd()<.5){a=e[0];b=e[1]}else{a=e[1];b=e[0]}}
    sparks.push({a,b,p:0,d:320+rnd()*420})}
  function draw(now,still){
    const dt=still?16:Math.min(50,now-last||16);last=now;const t=now/1000,st=state==='starting'?'listening':state;
    const K={idle:{rate:1.1,casc:.12,spd:1,hue:C.a,edge:.11},listening:{rate:3+energy*16,casc:.34,spd:1.3,hue:C.a,edge:.16},thinking:{rate:17,casc:.7,spd:2,hue:C.t,edge:.2},speaking:{rate:4+env*9,casc:.3,spd:1.2,hue:C.a,edge:.15}}[st]||{rate:1,casc:.1,spd:1,hue:C.a,edge:.11};
    energy*=Math.exp(-dt/450);
    env=st==='speaking'?Math.max(now-lastTick<280?.8:0,.5+.5*Math.sin(t*7.3)*Math.sin(t*2.1+1)):0;
    if(!still){acc+=K.rate*dt/1000;while(acc>1){acc--;spawn()}}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.lineCap='round';
    /* rings */
    ctx.setLineDash([2,7]);ctx.lineWidth=1;ctx.strokeStyle=`rgba(${K.hue},.2)`;ctx.beginPath();ctx.arc(CX,CY,92,0,6.2832);ctx.stroke();ctx.setLineDash([]);
    const rot=still?0:t*(st==='thinking'?1.7:st==='idle'?.22:.5);
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(CX,CY,87,rot+i*2.0944,rot+i*2.0944+1.05);ctx.strokeStyle=`rgba(${K.hue},${st==='idle'?.26:.55})`;ctx.lineWidth=1.5;ctx.stroke()}
    if(st==='listening'){ctx.beginPath();for(let i=0;i<=90;i++){const a=i/90*6.2832,amp=1.2+energy*8,r=80+Math.sin(a*5+t*6)*amp*.6+Math.sin(a*9-t*4.3)*amp*.4,x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.closePath();ctx.strokeStyle=`rgba(${C.b},${.3+energy*.55})`;ctx.lineWidth=1.3;ctx.stroke()}
    if(st==='speaking')for(let i=0;i<3;i++){const p=((t*.85+i/3)%1),r=34+p*52;ctx.beginPath();ctx.arc(CX,CY,r,0,6.2832);ctx.strokeStyle=`rgba(${C.b},${(1-p)*.3*(.35+env)})`;ctx.lineWidth=1.2;ctx.stroke()}
    /* brain */
    const sc=1+energy*.025+(st==='speaking'?env*.012:0);ctx.translate(CX,CY);ctx.scale(sc,sc);ctx.translate(-CX,-CY);
    ctx.lineWidth=1.3;ctx.strokeStyle=`rgba(${K.hue},${st==='idle'?.34:.5})`;ctx.stroke(P);
    ctx.lineWidth=1;ctx.strokeStyle=`rgba(${K.hue},.16)`;for(const s of SUL)ctx.stroke(s);
    ctx.beginPath();for(const[a,b]of edges){ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y)}ctx.strokeStyle=`rgba(${K.hue},${K.edge})`;ctx.lineWidth=.7;ctx.stroke();
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.p+=dt/s.d*K.spd;const A=nodes[s.a],B=nodes[s.b];
      if(s.p>=1){B.e=1;sparks.splice(i,1);if(rnd()<K.casc)spawn(s.b);continue}
      const x=A.x+(B.x-A.x)*s.p,y=A.y+(B.y-A.y)*s.p;
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(x,y);ctx.strokeStyle=`rgba(${K.hue},.45)`;ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=`rgba(${K.hue},.2)`;ctx.beginPath();ctx.arc(x,y,4.5,0,6.2832);ctx.fill();
      ctx.fillStyle=`rgba(${C.b},1)`;ctx.beginPath();ctx.arc(x,y,1.5,0,6.2832);ctx.fill()}
    for(const n of nodes){n.e*=Math.exp(-dt/520);const br=still?.6:.5+.5*Math.sin(t*1.4+n.ph),lit=still&&st!=='idle'?.6:n.e,
        jx=st==='listening'&&!still?Math.sin(t*9+n.ph)*energy*1.4:0,jy=st==='listening'&&!still?Math.cos(t*8+n.ph)*energy*1.4:0;
      if(lit>.12){ctx.fillStyle=`rgba(${K.hue},${.16*lit})`;ctx.beginPath();ctx.arc(n.x+jx,n.y+jy,(n.r+lit*1.6)*3,0,6.2832);ctx.fill()}
      ctx.fillStyle=`rgba(${lit>.5?C.b:K.hue},${Math.min(1,.38+.24*br+.5*lit)})`;ctx.beginPath();ctx.arc(n.x+jx,n.y+jy,n.r+lit*1.5,0,6.2832);ctx.fill()}
  }
  function loop(now){raf=0;if(state==='idle'){skip=!skip;if(skip){raf=requestAnimationFrame(loop);return}}draw(now);raf=requestAnimationFrame(loop)}
  function sync(){const want=!reduce&&document.visibilityState==='visible'&&S.view==='today'&&vis;
    if(want&&!raf){last=performance.now();raf=requestAnimationFrame(loop)}else if(!want&&raf){cancelAnimationFrame(raf);raf=0}
    if(reduce)draw(performance.now(),true)}
  let vis=true;try{new IntersectionObserver(es=>{vis=es[0].isIntersecting;sync()}).observe(cv)}catch(e){}
  try{new MutationObserver(()=>{colors();if(reduce)draw(performance.now(),true)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
  addEventListener('resize',()=>{size();if(reduce)draw(performance.now(),true)});
  colors();size();
  return{set(s){if(s!==state){state=s;if(s==='thinking')for(let i=0;i<8;i++)spawn();if(reduce)draw(performance.now(),true)}},kick(a){energy=Math.min(1,energy+a)},tick(){lastTick=performance.now()},sync};
})();

/* ---------- events ---------- */
document.addEventListener('toggle',e=>{const k=e.target?.dataset?.key;if(k)e.target.open?S.open.add(k):S.open.delete(k)},true);
document.addEventListener('pointerdown',()=>{if(V.unlocked||tts||!('speechSynthesis'in window))return;V.unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&today()!==S.day&&!window.__HQ_DAY){location.reload();return}orb.sync()});
$('dump').addEventListener('input',()=>{grow();orb.kick(.35)});
$('dump').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();const el=$('dump'),t=el.value;el.value='';grow();respond(t)}});
document.addEventListener('click',async e=>{
  const nb=e.target.closest('nav button');if(nb){show(nb.dataset.v);return}
  if(e.target.id==='sheet'){$('sheet').hidden=true;return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='orb')return orbTap();

  if(a==='sendNow')return finish(true);
  if(a==='cancelListen')return finish(false);
  if(a==='stopSpeak')return stopSpeak();
  if(a==='voice'){V.voiceOn=!V.voiceOn;try{localStorage.setItem('hq.voice',V.voiceOn?'1':'0')}catch(e){}if(!V.voiceOn)stopSpeak();renderCore();toast(V.voiceOn?'Spoken replies on':'Spoken replies off',1600);return}
  if(a==='brief')return speak(briefText(),true);
  if(a==='up')return upSheet();
  if(a==='upNow'){$('sheet').hidden=true;return markUp(nowHM())}
  if(a==='upSet'){const t=$('upT').value;if(/^\d\d:\d\d$/.test(t)){$('sheet').hidden=true;return markUp(t)}return}
  if(a==='upClear'){const hb={...(S.habits.get(today())||{}),date:today(),up:false};delete hb.upAt;S.habits.set(today(),hb);await db?.doc('habits/'+today()).set(hb).catch(()=>{});$('sheet').hidden=true;V.greeting=true;renderToday();return}
  if(a==='habit'){const hb={...(S.habits.get(today())||{}),date:today()},h=b.dataset.h;hb[h]=!hb[h];S.habits.set(today(),hb);renderToday();await db?.doc('habits/'+today()).set(hb).catch(()=>{});if(hb[h])say(`Logged, ${sir()}. Good work.`,true);return}
  if(a==='plan')return makePlan('He asked to replan from the current time. Keep earlier picks where they still fit.',true);
  if(a==='done'){const t=S.tasks.get(id);if(!t)return;const wasPick=(S.plan?.picks||[]).some(k=>k.id===id)&&S.view==='today',nx=openPicks(id)[0];
    await up(id,{s:'done',doneAt:stamp(),ev:'tapped Done'});
    if(wasPick)say(nx?`Done, ${sir()}. Next: ${T(nx.t)}.`:`Done, ${sir()}. That clears today’s list.`,true);else toast('Done: '+t.t);return}
  if(a==='set'){await up(id,{s:b.dataset.s});return}
  if(a==='mark'){const t=S.tasks.get(id),mk=b.dataset.m,marks={...(S.plan?.marks||{}),[id]:mk},nx=openPicks(id)[0];
    if(S.plan)S.plan={...S.plan,marks};await db.doc('plans/'+today()).update({marks}).catch(()=>{});if(t)await up(id,{defer:(t.defer||0)+1});
    if(mk==='stuck'){V.ctx={stuck:id};say(`What’s in the way, ${sir()}? Tell me and I’ll sort it out.`,true);if(!dict)$('dump').focus()}
    else say(nx?`No problem. Next: ${T(nx.t)}.`:`No problem, ${sir()}. Nothing else is queued for today.`,true);return}
  if(a==='sec'){S.open.add(b.dataset.key);renderToday();document.querySelector(`details[data-key="${b.dataset.key}"]`)?.scrollIntoView({block:'start',behavior:'smooth'});return}
  if(a==='focus'){show('today');say(b.dataset.say||'Go ahead.',true);if(!dict){$('dump').focus()}$('orbBtn').scrollIntoView({block:'start',behavior:'smooth'});return}
  if(a==='goAI')return show('ai');
  if(a==='aiMakeup'){const s=S.students.get(id);if(s)runJob(`Write a short, warm WhatsApp message to ${s.parent||'the parent'} of ${s.name}: ${s.name} is owed ${s.owed} hour(s) of makeup time and there is a free spot ${b.dataset.slot}. Ask if they can come then, and offer to find another time if not.`);return}
  if(a==='area'){S.area=b.dataset.a;renderList();return}
  if(a==='stat'){S.stat=b.dataset.s;renderList();return}
  if(a==='att'){const s=S.students.get(id);if(s){await logAtt(s,b.dataset.st,1);renderToday();toast(s.name+': '+(b.dataset.st==='absent'?'missed, makeup owed':b.dataset.st==='makeup'?'makeup done':'came'),1800)}return}
  if(a==='paidFull'){const s=S.students.get(id);if(s){const ok=await recordPaid(s,s.fee.due,today());toast(s.name+' marked paid'+(ok?', and your fee sheet is updated.':'. Your fee sheet will be updated overnight.'),7000,{label:'Undo',fn:async()=>{const cur=S.students.get(id);toast(cur&&await undoPaid(cur)?'Undone.':'Couldn’t reach your fee sheet, so nothing was undone.')}})}return}
  if(a==='undoPay'){const s=S.students.get(id);if(s)toast(await undoPaid(s)?s.name+': payment undone.':'Couldn’t reach your fee sheet, so nothing was undone.');return}
  if(a==='feeSync'){b.disabled=true;const r=await feeSync();b.disabled=false;toast(r.msg,5000);if(linked())schedSync();return}
  if(a==='schedLink')return linkSheet();
  if(a==='schedSync'){const r=await schedSync();toast(r.msg,4200);return}
  if(a==='schedCheck'){const m=($('schedUrl').value||'').match(/\/d\/([A-Za-z0-9_-]{20,})/);if(!m){toast('Paste the link to the “TutorWise Scheduler Export” sheet first.');return}
    await db.doc('settings/main').set({...S.settings,schedSheetId:m[1]});S.settings.schedSheetId=m[1];const r=await schedSync();
    if(r.ok){$('sheet').hidden=true;say(`Your scheduler is linked, ${sir()}. ${r.msg}`,true)}else toast(r.msg,6000);return}
  if(a==='feeNotes')return feeNotes();
  if(a==='aiGo'){const q=$('aiAsk').value.trim();if(q){$('aiAsk').value='';runJob(q)}return}
  if(a==='aiTask'){const t=S.tasks.get(id);if(t)runJob('Do as much of this as can be done on paper, or draft what is needed: '+T(t)+(t.next?'. Next step: '+t.next:''),id);return}
  if(a==='aiStu'){const s=S.students.get(id);if(s)runJob(`Write a short, warm WhatsApp message to ${s.parent||'the parent'} of ${s.name}. ${owes(s)?'Fees of '+money(owes(s))+' for this month are unpaid (fee note given '+(s.fee?.given||'earlier')+'). ':''}${s.owed?s.name+' is owed '+s.owed+' hour(s) of makeup time; offer to book it and ask which days work. ':''}Notes: ${s.n||'none'}`);return}
  if(a==='aiChase'){const l=feeTot().ow.map(s=>`${s.name}${s.parent?' (parent '+s.parent+')':''}: ${money(owes(s))}, note given ${s.fee?.given||'?'}`).join('; ');runJob('Write one short, polite fee reminder WhatsApp message per family, ready to paste. Friendly, not pushy. Combine siblings with the same parent into one message. Families and amounts: '+l);return}
  if(a==='redo'){const d=S.drafts.find(x=>x.id===id);if(d)runJob(d.ask,d.taskId,d.id);return}
  if(a==='delDraft'){db.doc('drafts/'+id).delete().catch(()=>{});return}
  if(a==='copy'){const el=$(b.dataset.from);try{await navigator.clipboard.writeText(el.textContent);toast('Copied')}catch(e){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Copy it from here.')}return}
  if(a==='settings')return settingsSheet();
  if(a==='testVoice'){if(tts)tts.speak(`Good day, ${$('s_address').value||'sir'}. Everything is ready.`,{voice:$('s_voice').value,rate:1.05}).catch(()=>{});return}
  if(a==='close'){$('sheet').hidden=true;return}
  if(a==='saveSettings'){const n={...S.settings};for(const k of['address','wake','workStart','teachStart','teachEnd','protect'])n[k]=$('s_'+k).value||DEF[k];n.capacity=+$('s_capacity').value;
    if($('s_voice'))n.voice=$('s_voice').value;if($('s_autoSend'))n.autoSend=$('s_autoSend').checked;
    await db?.doc('settings/main').set(n).catch(()=>toast('Could not save'));$('sheet').hidden=true;toast('Saved',1600);return}
});
renderAll();orb.sync();boot();
