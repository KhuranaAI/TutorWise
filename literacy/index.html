<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com; style-src 'self'; img-src 'self' data:; frame-src https://tutorwise-literacy.firebaseapp.com; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <title>Sign in | TutorWise Reading</title>
  <link rel="icon" href="../faviconTW.png" type="image/png" />
  <link rel="stylesheet" href="assets/literacy.css?v=4" />
  <script type="module" src="assets/signin.js?v=4"></script>
</head>
<body>
  <header class="topbar">
    <a href="../" aria-label="TutorWise home"><img src="../TW_logo.png" alt="TutorWise" /></a>
  </header>
  <main id="main">
    <div class="wrap wrap-narrow">
      <div class="card">
        <h1>Sign in</h1>
        <form class="form" id="signin" novalidate>
          <div class="field">
            <label for="who">Username or email</label>
            <input id="who" name="who" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>
          <div class="field">
            <label for="pw">Password</label>
            <input id="pw" name="pw" type="password" autocomplete="current-password" required />
          </div>
          <label class="check"><input type="checkbox" id="show" /> Show password</label>
          <p class="msg msg-bad" id="err" role="alert"></p>
          <button class="btn btn-primary" type="submit" id="go">Sign in</button>
        </form>
        <p class="space-top">
          <button class="btn btn-link" type="button" id="reset">Set or reset my password</button>
        </p>
        <p class="msg msg-ok" id="note" role="status"></p>
      </div>
    </div>
  </main>
  <noscript><p class="wrap msg msg-bad">This page needs JavaScript turned on.</p></noscript>
</body>
</html>
