<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff6ea" />
  <title>Bolo! | Learn Hindi by Building Sentences</title>
  <meta name="description" content="A playful beginner Hindi game: learn one sentence pattern, eight verbs, and start building your own Hindi sentences in 15 minutes." />
  <link rel="icon" href="../faviconTW.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar" hidden>
      <button class="icon-btn" id="home-btn" aria-label="Back to start">✕</button>
      <div class="track" id="track" aria-label="Module progress"></div>
      <div class="xp-pill" id="xp-pill" aria-live="polite"><span class="star">★</span><span id="xp-val">0</span><span class="streak" id="streak"></span></div>
    </header>
    <main id="screen"></main>
  </div>
  <div class="actionbar" id="actionbar" hidden><div class="actionbar-inner" id="actionbar-inner"></div></div>
  <div class="sheet" id="sheet" role="status" aria-live="assertive"><div class="sheet-inner" id="sheet-inner"></div></div>
  <noscript><p style="padding:20px">Bolo! needs JavaScript to run.</p></noscript>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
