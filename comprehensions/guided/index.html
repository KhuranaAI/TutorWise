<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Reading | TutorWise</title><link rel="icon" href="../../faviconTW.png" type="image/png"></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Poppins:wght@600;700&display=swap">
<style>
/* Layout: one calm column. A work-plan bar that never moves, one job per screen,
   and the same two buttons in the same place: Help bottom-left, the next action bottom-right. */
:root {
  --page: #f3f6f9;
  --paper: #ffffff;
  --ink: #1b2330;
  --muted: #56616f;
  --line: #d6dde6;
  --teal: #2a9d8f;
  --teal-soft: #e3f3f1;
  --found: #c5e9e4;
  --navy: #00357a;
  --navy-hover: #002a61;
  --heading: #00357a;
  --on-accent: #ffffff;
  --note: #fff5dc;
  --note-line: #e6c86e;
  --note-ink: #5a4000;
  --logo-bg: transparent;
  --shadow: 0 6px 24px rgb(0 30 70 / 0.14);
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --font-head: "Poppins", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --plan-h: 86px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #10141a; --paper: #181d26; --ink: #e7ebf1; --muted: #a4aebb; --line: #2f3745;
    --teal: #3dbbab; --teal-soft: #16302e; --found: #1f4f49;
    --navy: #2f6fd1; --navy-hover: #2a62ba; --heading: #a3c4ff; --on-accent: #ffffff;
    --note: #352c14; --note-line: #6e5c22; --note-ink: #f1d27c;
    --logo-bg: #ffffff; --shadow: 0 6px 24px rgb(0 0 0 / 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #10141a; --paper: #181d26; --ink: #e7ebf1; --muted: #a4aebb; --line: #2f3745;
  --teal: #3dbbab; --teal-soft: #16302e; --found: #1f4f49;
  --navy: #2f6fd1; --navy-hover: #2a62ba; --heading: #a3c4ff; --on-accent: #ffffff;
  --note: #352c14; --note-line: #6e5c22; --note-ink: #f1d27c;
  --logo-bg: #ffffff; --shadow: 0 6px 24px rgb(0 0 0 / 0.5); color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2 { font-family: var(--font-head); color: var(--heading); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; line-height: 1.25; }
h2 { font-size: 1.15rem; }
p { margin: 0; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

/* work plan: what, how much, where I am */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.plan { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--paper); border-bottom: 1px solid var(--line); }
.plan-in, .wrap, .bar-in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.plan-in { padding-block: 10px; display: grid; gap: 10px; }
.plan-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { height: 28px; width: auto; display: block; background: var(--logo-bg); border-radius: 6px; }
.plan-label { font-family: var(--font-head); font-weight: 600; color: var(--heading); font-size: 1rem; text-align: right; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.dot.done { background: var(--teal); }
.dot.now { background: var(--navy); }
.dot.gap { margin-left: 10px; }

.wrap { padding-block: 0 130px; display: grid; gap: 16px; }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--plan-h)); z-index: 5; background: var(--page); padding-block: 14px 2px; display: grid; gap: 8px; }
.task { background: var(--navy); color: var(--on-accent); border-radius: 10px; padding: 12px 16px; font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.task small { display: block; font-weight: 400; opacity: 0.85; font-size: 0.85rem; letter-spacing: 0.02em; }
.fb { border-radius: 10px; padding: 11px 16px; border-left: 6px solid; font-size: 1.05rem; }
.fb.yes { background: var(--teal-soft); border-color: var(--teal); }
.fb.no { background: var(--note); border-color: var(--note-line); color: var(--note-ink); }
.hint { border: 2px dashed var(--line); border-radius: 10px; padding: 10px 16px; background: var(--paper); }
.hint b { font-family: var(--font-head); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
.eyebrow { font-family: var(--font-head); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.genre { color: var(--muted); font-style: italic; }
.plan-list { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 1.15rem; }
.question { font-size: 1.2rem; font-weight: 700; line-height: 1.45; }

.passage { gap: 16px; }
.para { font-size: 1.2rem; line-height: 1.75; max-width: 64ch; }
.para.dim { opacity: 0.3; }
.pn { font-weight: 700; color: var(--heading); font-size: 0.95rem; margin-right: 6px; }
.sent { cursor: pointer; border-radius: 4px; padding: 2px 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sent:hover { background: var(--teal-soft); }
.sent:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; }
.sent.tried, .sent.tried:hover { color: var(--muted); background: none; cursor: default; }
.sent.found, .sent.found:hover { background: var(--found); cursor: default; }
.sent.point { outline: 3px dashed var(--teal); outline-offset: 1px; }
.locked .sent, .locked .sent:hover { cursor: default; }
.locked .sent:not(.found):hover { background: none; }

.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 1.1rem; cursor: pointer; min-height: 54px; display: grid; gap: 2px; align-content: center; }
.opt:hover:not(:disabled) { border-color: var(--teal); }
.opt small { color: var(--muted); font-size: 0.92rem; }
.opt.right { border-color: var(--teal); background: var(--teal-soft); }
.opt.wrong { border-style: dashed; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: 0.55; }

.have { border-left: 6px solid var(--teal); background: var(--teal-soft); border-radius: 10px; padding: 10px 16px; display: grid; gap: 6px; }
.have .lbl { font-family: var(--font-head); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
textarea { width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 1.15rem; line-height: 1.6; }
textarea:focus { border-color: var(--teal); }
.count { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.count.over { color: var(--note-ink); font-weight: 700; }

/* the two buttons that never move */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar-in { padding-block: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn { border: 2px solid var(--navy); border-radius: 10px; min-height: 50px; padding: 10px 26px; font-family: var(--font-head); font-weight: 600; font-size: 1.05rem; cursor: pointer; background: var(--navy); color: var(--on-accent); }
.btn:hover { background: var(--navy-hover); border-color: var(--navy-hover); }
.btn.ghost { background: var(--paper); color: var(--heading); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--teal); background: var(--paper); }
.btn.small { min-height: 40px; padding: 6px 16px; font-size: 0.95rem; justify-self: start; }
.btn:disabled, .btn:disabled:hover { opacity: 0.5; cursor: default; background: var(--navy); border-color: var(--navy); }

/* a quiet, predictable wait: after a miss, and while a paragraph is being read */
.wait { display: block; height: 6px; border-radius: 3px; background: var(--note-line); overflow: hidden; margin-top: 8px; }
.wait i { display: block; height: 100%; background: var(--note-ink); transform-origin: left; animation: fill linear both; }
.wait-note { display: block; font-size: 0.9rem; margin-top: 6px; }
.bar-wait .wait { margin: 0; border-radius: 0; height: 5px; background: var(--line); }
.bar-wait .wait i { background: var(--teal); }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .wait i { animation: none; } }
.plan-side { display: grid; justify-items: end; gap: 0; }
.plan-count { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.selfcheck { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px)); z-index: 20; background: var(--paper); border: 2px solid var(--navy); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; }
.selfcheck p { font-family: var(--font-head); font-weight: 600; font-size: 1.1rem; color: var(--heading); }
.selfcheck .row { display: flex; gap: 10px; }
.selfcheck .btn { flex: 1; }

/* tutor-only parts */
details.tutor { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 16px; color: var(--muted); }
details.tutor summary { cursor: pointer; font-weight: 700; }
.settings { display: grid; gap: 14px; margin-top: 12px; color: var(--ink); }
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 0.95rem; }
.field select, .field input[type="text"] { padding: 9px 11px; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); max-width: 100%; }
.field small { color: var(--muted); }
.check-row { display: flex; gap: 10px; align-items: center; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.76rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; color: var(--heading); }
.answer { background: var(--page); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.muted { color: var(--muted); }
.flag { display: inline-block; background: var(--note); color: var(--note-ink); border-radius: 999px; padding: 1px 10px; font-size: 0.82rem; font-weight: 700; margin: 0 4px 4px 0; }
.report-out { min-height: 180px; font: 0.85rem/1.5 ui-monospace, Consolas, monospace; }
.stack { display: grid; gap: 10px; }

@media (max-width: 480px) {
  .card { padding: 16px; }
  h1 { font-size: 1.35rem; }
  .para { font-size: 1.12rem; }
  .btn { padding-inline: 20px; }
  /* keep the pinned instruction area small so the text below stays in view */
  .sticky { padding-block: 10px 2px; gap: 6px; }
  .task { font-size: 1.05rem; padding: 9px 14px; line-height: 1.35; }
  .fb { font-size: 0.98rem; padding: 8px 12px; }
  .hint { font-size: 0.98rem; padding: 7px 12px; line-height: 1.4; }
}
</style>

/* ============================ helpers ============================ */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const words = (s) => String(s).toLowerCase().replace(/[’']/g, "").match(/[a-z0-9]+/g) || [];
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const clock = (secs) => `${Math.floor(secs / 60)}:${String(Math.round(secs) % 60).padStart(2, "0")}`;
function stripPrefix(text, prefix) {
  const p = (prefix || "").trim();
  const t = text.trimStart();
  return p && t.toLowerCase().startsWith(p.toLowerCase()) ? t.slice(p.length) : text;
}

// Every passage word with where it came from, for the copy check.
const PW = [];
R.paras.forEach((para, pi) => para.s.forEach((sent, si) => words(sent).forEach((w) => PW.push({ w, id: `${pi + 1}-${si + 1}`, p: pi + 1 }))));
function longestRun(ans) {
  let best = { len: 0, at: -1 };
  let prev = new Array(PW.length + 1).fill(0);
  for (let i = 1; i <= ans.length; i++) {
    const cur = new Array(PW.length + 1).fill(0);
    for (let j = 1; j <= PW.length; j++) {
      if (ans[i - 1] === PW[j - 1].w) {
        cur[j] = prev[j - 1] + 1;
        if (cur[j] > best.len) best = { len: cur[j], at: j - cur[j] };
      }
    }
    prev = cur;
  }
  return best;
}
const sentenceText = (id) => { const [p, s] = id.split("-").map(Number); return R.paras[p - 1].s[s - 1]; };

function fresh(settings) {

function newSS(step) {

    draft: step && step.prefill ? step.prefill : "", starter: "", hit: null, shrunk: 0, copyFinal: false, off: false,

/* ============================ shared step parts ============================ */
function hintText(step, level) {

  const hint = step.hints[level - 1];
  if (step.type === "find") {
    if (hint.narrow) return `Look in paragraph ${hint.narrow.join(" or ")}. The other paragraphs are faded.`;
    if (hint.point) return "Look at the sentence with the dashed line.";
    return hint.t;
  }
  if (hint.starter) return `Try starting your answer like this: “${hint.starter.trim()} …”`;
  return hint.t;
}
const maxHint = (step) => (step.type === "choose" ? 1 : step.hints.length);

function taskBlock(label, prompt, step) {
  const ss = S.ss;

    h("div", { class: "task" }, label && h("small", {}, label), prompt),
    ss && ss.fb && h("p", { class: `fb ${ss.fb.k}`, role: "status" }, ss.fb.t,
      lockLeft() > 0 && [h("span", { class: "wait-note" }, "Read this first. Then try again."), waitBar(ss.lockMs, lockLeft())]),
    ss && step && ss.hint > 0 && !ss.done && h("div", { class: "hint" }, h("b", {}, `Hint ${ss.hint} of ${maxHint(step)}`), hintText(step, ss.hint)));
}

function ownWords(step) {          // what the student typed, without any starter we gave

}

  else if (ss.hint < maxHint(step)) { ss.hint++; applyHint(step); ss.fb = null; }

}

/* ---- find ---- */
function passageCard(q, step) {

    h("p", { class: `para${narrow && !narrow.includes(pi + 1) ? " dim" : ""}` },
      h("span", { class: "pn" }, `[${pi + 1}]`),
      p.s.map((sent, si) => {
        const id = `${pi + 1}-${si + 1}`;
        const found = earlier.includes(id), tried = ss.wrong.includes(id);

    return complete(step, "Yes. You found it.");

  ss.wrong.push(id);
  ss.fb = { k: "no", t: "Not that one. Try another sentence." };
  missed(step);

/* ---- write ---- */
function writeBox(q, step) {
  const ss = S.ss;
  const ta = h("textarea", { id: `answer-${q.id}`, "aria-label": "Your answer", spellcheck: "true", disabled: ss.done });
  ta.value = ss.draft;
  const count = step.max ? h("p", { class: "count" }) : null;
  const upd = () => {
    if (!count) return;
    const n = words(ta.value).length;
    count.textContent = n > step.max ? `${plural(n, "word")}. Shrink it to ${step.max} or fewer.` : `${plural(n, "word")} of ${step.max}`;
    count.className = `count${n > step.max ? " over" : ""}`;

function doneWrite(q, step) {

  const no = (t) => { ss.fb = { k: "no", t }; save(); render(); };
  if (ownWords(step).length < 3) return no("Write a little more. Use a full sentence.");
  ss.tries++;
  if (step.max && words(text).length > step.max) { ss.shrunk++; return no(`That is ${words(text).length} words. Shrink it to ${step.max} or fewer.`); }
  const run = longestRun(body);

        h("li", {}, "Find a sentence in the text."),
        h("li", {}, "Answer in your own words."))));
  setBar(null, { label: "Start questions", fn: () => { S.phase = "q"; S.q = 0; S.step = 0; S.ss = newSS(QS()[0].steps[0]); save(); render(); window.scrollTo(0, 0); } });
}

function renderQuestion() {
  const q = QS()[S.q], step = q.steps[S.step], ss = S.ss;
  const qCard = h("section", { class: "card" },
    h("p", { class: "eyebrow" }, `Question ${S.q + 1}`),
    h("p", { class: "question" }, q.text),
    listenBtn(`${q.text} ${step.prompt}`));
  const head = taskBlock(`Step ${S.step + 1} of ${q.steps.length} · ${step.name}`, step.prompt, step);
  let body;
  if (step.type === "find") body = [qCard, passageCard(q, step)];
  else if (step.type === "choose") body = [qCard, step.sort ? null : haveBox(q), optionList(step)];
  else body = [qCard, haveBox(q), writeBox(q, step)];
  app.replaceChildren(head, ...body.filter(Boolean));
  setBar(ss.done ? null : () => help(step),
    ss.done ? { label: "Next", fn: advance } : step.type === "write" ? { label: "Done", fn: () => doneWrite(q, step) } : null);
}

function advance() {
  if (S.phase === "read") {
    if (S.part + 1 < R.paras.length) { S.part++; S.stage = "reading"; S.partT0 = Date.now(); S.ss = null; }
    else { S.phase = "mid"; S.ss = null; }
  } else if (S.phase === "q") {
    const qs = QS(), q = qs[S.q];
    if (S.step + 1 < q.steps.length) S.step++;
    else if (S.q + 1 < qs.length) { S.q++; S.step = 0; }
    else { S.phase = "done"; S.ss = null; pushHistory(); save(); render(); window.scrollTo(0, 0); return; }
    S.ss = newSS(QS()[S.q].steps[S.step]);
  }
  save(); render(); window.scrollTo(0, 0);
}

function renderDone() {
  app.replaceChildren(
    h("div", { class: "sticky" }),
    h("section", { class: "card" },
      h("h1", {}, "Finished."),
      h("p", {}, `You read ${R.paras.length} paragraphs and answered ${plural(S.settings.nQ, "question")}.`),
      S.settings.showCount && h("p", {}, `Right on the first try: ${S.log.filter((e) => e.first).length} of ${S.log.length}.`),
      h("p", { class: "question" }, S.settings.next)),
    h("div", { class: "row" },
      h("button", { class: "btn ghost small", type: "button", id: "report-btn", onclick: () => { S.phase = "report"; save(); render(); window.scrollTo(0, 0); } }, "Tutor report")));
  setBar(null, null);
}

/* ============================ tutor: settings ============================ */
function tutorPanel() {
  const s = S.settings;
  const select = (id, value, options, on) => {
    const el = h("select", { id }, options.map(([v, t]) => h("option", { value: String(v) }, t)));
    el.value = String(value);
    el.addEventListener("change", () => { on(el.value); save(); tutorOpen = true; render(); });
    return el;
  };
  const next = h("input", { type: "text", id: "set-next", maxlength: "80" });
  next.value = s.next;
  next.addEventListener("change", () => { s.next = next.value.trim() || DEFAULTS.next; save(); tutorOpen = true; render(); });
  const listen = h("input", { type: "checkbox", id: "set-listen" });
  listen.checked = s.listen;
  listen.addEventListener("change", () => { s.listen = listen.checked; save(); });
  const showCount = h("input", { type: "checkbox", id: "set-count" });
  showCount.checked = s.showCount;
  showCount.addEventListener("change", () => { s.showCount = showCount.checked; save(); });
  const resetRow = h("div", { class: "row" });
  const resetBtn = h("button", { class: "btn ghost small", type: "button", id: "reset-btn" }, "Start again");
  resetBtn.addEventListener("click", () => {
    resetRow.replaceChildren(h("span", {}, "Erase this session’s answers and report?"),
      h("button", { class: "btn small", type: "button", id: "reset-yes", onclick: () => { S = fresh(S.settings); save(); tutorOpen = false; render(); } }, "Yes, erase"),
      h("button", { class: "btn ghost small", type: "button", onclick: () => { tutorOpen = true; render(); } }, "Cancel"));
  });
  resetRow.append(resetBtn);
  const d = h("details", { class: "tutor", id: "tutor-panel", open: tutorOpen },
    h("summary", {}, "Tutor settings"),
    h("div", { class: "settings" },
      h("p", { class: "muted" }, "Set these before the student starts. In the real app they sit on your teacher page, not here."),
      h("div", { class: "field" }, h("label", { for: "set-nq" }, "Questions today"),
        select("set-nq", s.nQ, [[1, "1 question"], [2, "2 questions"], [3, "3 questions"], [4, "4 questions"]], (v) => { s.nQ = Number(v); })),
      h("div", { class: "field" }, h("label", { for: "set-help" }, "Help already showing when a step opens"),
        select("set-help", s.startHelp, HELP_NAMES.map((t, i) => [i, t]), (v) => { s.startHelp = Number(v); }),
        h("small", {}, "Start high, so the first tries are right. Lower it one level when the first-try score stays at 80% or more.")),
      h("div", { class: "field" }, h("label", { for: "set-pause" }, "Pause after a wrong answer"),
        select("set-pause", s.pause, [[0, "Off"], [5, "5 seconds"], [10, "10 seconds"]], (v) => { s.pause = Number(v); }),
        h("small", {}, "Makes guessing slower than thinking. The explanation stays on screen during the pause.")),
      h("div", { class: "check-row" }, showCount, h("label", { for: "set-count" }, "Show the student their first-try count")),
      h("div", { class: "field" }, h("label", { for: "set-check" }, "“Am I working?” check"),
        select("set-check", s.checkMin, [[0, "Off"], [1, "Every 1 minute"], [2, "Every 2 minutes"], [3, "Every 3 minutes"], [5, "Every 5 minutes"]], (v) => { s.checkMin = Number(v); }),
        h("small", {}, "A small card the student answers Yes or Not yet. It goes away after 12 seconds."),
        h("button", { class: "btn ghost small", type: "button", id: "preview-check", onclick: () => showSelfCheck(true) }, "Preview the check")),
      h("div", { class: "check-row" }, listen, h("label", { for: "set-listen" }, "Show a Listen button (reads the text aloud)")),
      h("div", { class: "field" }, h("label", { for: "set-next" }, "When finished, the screen says"), next),
      resetRow));
  d.addEventListener("toggle", () => { tutorOpen = d.open; });
  return d;
}

/* ============================ tutor: report ============================ */
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const rushed = (r) => r.secs <= Math.ceil(r.words / READ_WORDS_PER_SEC) + 2;   // pressed the moment the button woke up
function notesFor(e) {
  const n = [];
  if (e.fast) n.push("Answered in under 3 seconds");
  if (e.early) n.push(`Pressed Help before trying ×${e.early}`);
  if (e.hint > e.given + e.auto) n.push("Asked for help");
  if (e.auto) n.push("Hint given after misses");
  if (e.copy) n.push(e.copyFinal ? "Copied from the text, and kept it" : "Copied at first, then reworded");
  if (e.off) n.push("May be off topic");
  else if (e.offFirst) n.push("Off topic at first, then fixed");
  if (e.shrunk) n.push(`Over 10 words ×${e.shrunk}`);
  return n;
}
function suggestion() {
  const L = S.log, level = S.settings.startHelp;
  const p = pct(L.filter((e) => e.first).length, L.length);
  const out = [];
  if (p >= 80) out.push(level > 0
    ? `First try was ${p}% with starting help at level ${level}. If the next session is also 80% or more, lower the starting help to level ${level - 1}.`
    : `First try was ${p}% with no starting help. Next, give more questions or a harder reading.`);
  else if (p < 50) out.push(level < 3
    ? `First try was only ${p}%. Raise the starting help to level ${level + 1} next session, and do the first paragraph and the first question together.`
    : `First try was only ${p}% even with the sentence pointed out. Do the next session side by side, and consider an easier reading.`);
  else out.push(`First try was ${p}%. Keep the starting help at level ${level} for the next session.`);
  const guesses = L.filter((e) => e.fast).length;
  const early = L.reduce((n, e) => n + e.early, 0);
  const copies = L.filter((e) => e.copy).length;
  const sorts = L.filter((e) => e.sort), sortMiss = sorts.filter((e) => !e.first).length;
  const rush = S.reads.filter(rushed).length;
  if (guesses >= 3) out.push(`${guesses} first answers came in under 3 seconds, which looks like guessing. Before the next session, agree a rule together: read every choice, then tap.`);
  else if (rush >= 3) out.push(`“I have read it” was pressed the moment it woke up on ${rush} paragraphs. Read the first paragraph together next time, or switch on Listen.`);
  else if (sorts.length >= 2 && sortMiss >= sorts.length / 2) out.push(`The sort was missed on ${sortMiss} of ${sorts.length} questions. Practise it together: can I point to the answer, or does the text only give clues?`);
  else if (early >= 2) out.push(`Help was pressed before trying ${early} times. Practise the rule together: try once, then Help.`);
  else if (copies >= 1) out.push(`${plural(copies, "answer")} started as a copy of the text. Practise “cover the text, then say it” on one question together.`);
  return out.join(" ");
}
const helpCell = (e) => (e.hint > e.given ? `${e.given} to ${e.hint}` : String(e.hint));
const triesText = (n) => (n === 1 ? "1 try" : `${n} tries`);
function reportText() {
  const L = S.log, out = [], first = L.filter((e) => e.first).length;
  out.push(`TutorWise guided reading report: ${R.title} (${R.id})`);
  out.push(`Right on the first try: ${first} of ${L.length} (${pct(first, L.length)}%)`);
  out.push(`Help showing at the start: ${HELP_NAMES[S.settings.startHelp]}`);
  out.push(`Pause after a wrong answer: ${S.settings.pause ? S.settings.pause + " seconds" : "off"}`);
  out.push(`Likely guesses (first answer in under 3 seconds): ${L.filter((e) => e.fast).length}`);
  out.push(`Time: reading ${clock(S.clock.read)}, questions ${clock(S.clock.q)}`);
  out.push(`"Am I working?" check: asked ${S.self.asked}, Yes ${S.self.yes}, Not yet ${S.self.notyet}, no answer ${S.self.none}`);
  out.push(`Listen used: ${S.listens}`);
  out.push("", "Reading time per paragraph:");
  S.reads.forEach((r) => out.push(`  [${r.p}] ${r.secs}s for ${r.words} words${rushed(r) ? " (pressed as soon as allowed)" : ""}`));
  out.push("", "Each step (tries, help level, notes):");
  L.forEach((e) => out.push(`  ${e.where}: ${triesText(e.tries)}, help ${helpCell(e)}${notesFor(e).length ? ", " + notesFor(e).join("; ") : ""}`));
  out.push("", "Written answers:");
  QS().forEach((q, i) => { if (S.answers[q.id]) out.push(`  Q${i + 1}. ${q.text}`, `      ${S.answers[q.id]}`); });
  out.push("", `Suggested next step: ${suggestion()}`);
  return out.join("\n");
}
function renderReport() {
  const L = S.log, first = L.filter((e) => e.first).length;
  const text = reportText();
  const past = history();
  const outBox = h("textarea", { class: "report-out", id: "report-out", readonly: true, "aria-label": "Report as text" });
  outBox.value = text;
  const msg = h("span", { class: "muted", role: "status" });
  const when = (iso) => new Date(iso).toLocaleString("en-CA", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  app.replaceChildren(
    h("div", { class: "sticky" }),
    h("section", { class: "card" },
      h("p", { class: "eyebrow" }, "For the tutor"),
      h("h1", {}, "How the session went"),
      h("p", { class: "big" }, `${first} of ${L.length} right on the first try (${pct(first, L.length)}%)`),
      h("p", { class: "muted" }, `Help showing at the start: ${HELP_NAMES[S.settings.startHelp]}. The aim over several sessions is to keep this score high while you lower the starting help, and to see the written answers stay good.`),
      h("div", { class: "have" }, h("span", { class: "lbl" }, "Suggested next step"), h("p", {}, suggestion()))),
    h("section", { class: "card" },
      h("h2", {}, "Written answers to mark"),
      QS().filter((q) => S.answers[q.id]).map((q) => h("div", { class: "stack" }, h("p", {}, h("strong", {}, q.text)), h("p", { class: "answer" }, S.answers[q.id]))),
      !QS().some((q) => S.answers[q.id]) && h("p", { class: "muted" }, "No written answers in this session.")),
    h("section", { class: "card" },
      h("h2", {}, "Each step"),
      h("div", { class: "table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, ["Step", "Tries", "Help level", "Time", "Notes"].map((t) => h("th", {}, t)))),
        h("tbody", {}, L.map((e) => h("tr", {},
          h("td", {}, e.where), h("td", {}, String(e.tries)), h("td", {}, helpCell(e)), h("td", {}, clock(e.secs)),
          h("td", {}, notesFor(e).map((n) => h("span", { class: "flag" }, n)), e.first && !notesFor(e).length && h("span", { class: "muted" }, "First try")))))))),
    h("section", { class: "card" },
      h("h2", {}, "Reading and attention"),
      h("div", { class: "table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, ["Paragraph", "Words", "Time before “I have read it”"].map((t) => h("th", {}, t)))),
        h("tbody", {}, S.reads.map((r) => h("tr", {}, h("td", {}, `[${r.p}]`), h("td", {}, String(r.words)),
          h("td", {}, `${r.secs} seconds `, rushed(r) && h("span", { class: "flag" }, "Pressed as soon as allowed"))))))),
      h("p", {}, `Likely guesses (first answer in under 3 seconds): ${L.filter((e) => e.fast).length}.`),
      h("p", {}, `Total time: reading ${clock(S.clock.read)}, questions ${clock(S.clock.q)}.`),
      h("p", {}, `“Am I working?” check: asked ${S.self.asked}. Yes ${S.self.yes}, Not yet ${S.self.notyet}, no answer ${S.self.none}.`),
      h("p", {}, `Listen button used ${plural(S.listens, "time")}.`)),
    past.length > 0 && h("section", { class: "card" },
      h("h2", {}, "Sessions finished on this device"),
      h("p", { class: "muted" }, "Newest first. Improvement looks like the first-try score holding while the starting help comes down."),
      h("div", { class: "table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, ["When", "Starting help", "First try", "Likely guesses", "Asked for help", "Time"].map((t) => h("th", {}, t)))),
        h("tbody", {}, past.map((r) => h("tr", {},
          h("td", {}, when(r.when)), h("td", {}, `Level ${r.startHelp}`), h("td", {}, `${r.first} of ${r.total} (${pct(r.first, r.total)}%)`),
          h("td", {}, String(r.guesses)), h("td", {}, plural(r.asked, "step")), h("td", {}, clock(r.secs)))))))),
    h("section", { class: "card" },
      h("h2", {}, "Copy this report"),
      outBox,
      h("div", { class: "row" },
        h("button", { class: "btn small", type: "button", id: "copy-report", onclick: async () => {
          try { await navigator.clipboard.writeText(text); msg.textContent = "Copied."; }
          catch (e) { outBox.focus(); outBox.select(); msg.textContent = "Press Ctrl+C to copy the selected text."; }
        } }, "Copy report"),
        msg,
        h("button", { class: "btn ghost small", type: "button", onclick: () => { S.phase = "done"; save(); render(); } }, "Back"),
        h("button", { class: "btn ghost small", type: "button", id: "again-btn", onclick: () => { S = fresh(S.settings); save(); render(); window.scrollTo(0, 0); } }, "Start a new session"))));
  setBar(null, null);
}

/* ============================ "Am I working?" check ============================ */
let elapsed = 0, scOpen = false, scHide = null;
function showSelfCheck(preview) {
  if (scOpen) return;
  if (!preview) { S.self.asked++; save(); }
  const close = () => { clearTimeout(scHide); slot.replaceChildren(); scOpen = false; };
  const card = h("div", { class: "selfcheck", role: "group", "aria-label": "Working check" });
  const answer = (k) => {
    if (!preview) { S.self[k]++; save(); }
    clearTimeout(scHide);
    if (k === "notyet") { card.replaceChildren(h("p", {}, "OK. Your next step is on the screen.")); scHide = setTimeout(close, 4000); }
    else close();
  };
  card.append(h("p", {}, "Am I working on my reading?"),
    h("div", { class: "row" },
      h("button", { class: "btn", type: "button", id: "sc-yes", onclick: () => answer("yes") }, "Yes"),
      h("button", { class: "btn ghost", type: "button", id: "sc-notyet", onclick: () => answer("notyet") }, "Not yet")));
  slot.replaceChildren(card);
  scOpen = true;
  scHide = setTimeout(() => { if (!preview) { S.self.none++; save(); } close(); }, 12000);
}
setInterval(() => {
  if (document.hidden) return;
  if (S.phase === "read") S.clock.read++;
  else if (S.phase === "q") S.clock.q++;
  else { elapsed = 0; return; }
  if ((S.clock.read + S.clock.q) % 10 === 0) save();
  if (!S.settings.checkMin || scOpen) return;
  if (++elapsed >= S.settings.checkMin * 60) { elapsed = 0; showSelfCheck(false); }
}, 1000);

/* ============================ go ============================ */
let wake = null;
function render(keepSpeech) {
  clearTimeout(wake);
  if (keepSpeech !== true) stopSpeech();
  renderPlan();
  if (S.phase === "start") renderStart();
  else if (S.phase === "read") renderRead();
  else if (S.phase === "mid") renderMid();
  else if (S.phase === "q") renderQuestion();
  else if (S.phase === "done") renderDone();
  else renderReport();
  measure();
  // Re-draw when a pause after a miss, or the minimum reading time, runs out.
  let left = lockLeft();
  if (S.phase === "read" && S.stage === "reading") {
    const need = Math.ceil(words(R.paras[S.part].s.join(" ")).length / READ_WORDS_PER_SEC) * 1000;
    left = Math.max(0, need - (Date.now() - S.partT0));
  }
  if (left > 0) wake = setTimeout(() => render(true), left + 40);
}
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
